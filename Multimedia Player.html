<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>Multimedia Player</h1>
  <section>
    <h2>Wildflower</h2>
    <audio controls aria-label="By Billie Elish">
      <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio"></source>
    </audio>
  </section>
  <section>
    <h2>Video </h2>
    <video controls width="500">
      <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video"></source>
      <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="video" srclang="Chinese" label="English"></track>
    </video>   
  </section>
  <section>
    <h2></h2>
    <p>This is the transcript</p>
  </section>
</body>

</html>
