<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="blog-post-card">
    <img
      class="post-img"
      src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
      alt="A cover photo for the blog post"
    >

    <div class="post-content">
      <h2 class="post-title">My Web Development Journey</h2>

      <p class="post-excerpt">
        Learning HTML, CSS, and JavaScript has helped me build a strong
        foundation in web development and create practical projects.
      </p>

      <a class="read-more" href="#">Read More</a>
    </div>
  </div>

</body>
</html>
