<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css"></link>
</head>

<body>
  <ul class="todo-list">
    <li> 
       <input type="checkbox" id="todo-1"/>
       <label for="todo-1">Learn HTML</label>
       <ul class="sub-item">
      <li><a class="sub-item-link" href="https://www.freecodecamp.org/learn/" class="sub-item-link" target="_blank">Practice HTML basics</a></li>
    </ul>
    </li>
    <li>
       <input type="checkbox" id="todo-2"/>
       <label for="todo-2">Learn CSS</label>
        <ul class="sub-item">
      <li><a href="https://www.freecodecamp.org/learn/" class="sub-item-link" target="_blank">Practice CSS styling</a></li>
    </ul>
    </li>
    <li>
        <input type="checkbox" id="todo-3"/>
        <label for="todo-3">Learn JavaScript</label>
        <ul class="sub-item">
      <li><a href="https://www.freecodecamp.org/learn/javascript-algorithms-and-data-structures-v8/" class="sub-item-link" target="_blank">Practice JavaScript basics</a></li>
    </ul>
    </li>
    <li>
        <input type="checkbox" id="todo-4"/>
        <label for="todo-4">Build a project</label>
        <ul class="sub-item">
      <li><a href="https://github.com/" class="sub-item-link" target="_blank">Build a web project</a></li>
    </ul>
    </li>
  </ul>
</body>

</html>
